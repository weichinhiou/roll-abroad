<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大赴翁 Roll Abroad</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f6d5f'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23f7f4ec' font-family='sans-serif'%3E%E8%B5%B4%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>大赴翁 <span>Roll Abroad</span></h1>
      <div class="toolbar">
        <label>seed <input id="seed" value="demo-1109" size="10" /></label>
        <button id="restart" class="ghost">重新開始</button>
      </div>
    </header>

    <main>
      <section id="left">
        <div id="res" class="resbar"></div>
        <p id="rollinfo" class="rollinfo"></p>
        <div id="board3d" class="board3d"></div>
        <div id="board" class="board"></div>
        <div id="items" class="items"></div>
        <div id="forced" class="forced" hidden>
          指定點數：
          <button data-face="1">1</button><button data-face="2">2</button><button data-face="3">3</button>
        </div>
      </section>

      <section id="panel" class="panel"></section>

      <section class="logbox">
        <h2>行程紀錄</h2>
        <ul id="log"></ul>
      </section>
    </main>

    <dialog id="modal" class="modal" tabindex="-1" aria-label="事件與結果"></dialog>

    <footer>
      本遊戲供練習與理解，不取代正式規範；精確金額與期限請上無界任意門查詢。
    </footer>

    <script>
      // 直接雙擊 index.html（file://）時，瀏覽器會擋掉 ES module 與 fetch，畫面只剩空殼；改成顯示怎麼開。
      if (location.protocol === "file:") {
        document.getElementById("panel").innerHTML =
          "<h2>請改用網址開啟</h2><p>直接雙擊 index.html 時，瀏覽器會擋住遊戲程式。</p>" +
          "<p>請雙擊資料夾裡的 <b>start-game.cmd</b>，它會自動開啟 http://localhost:4191 。</p>";
      }
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
